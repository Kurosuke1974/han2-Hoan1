<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高圧ガス販売二種一問一答</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background-color: #eef2f3; padding: 20px; color: #333; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 450px; margin: auto; min-height: 350px; display: flex; flex-direction: column; justify-content: center; }
        .hidden { display: none !important; }
        .start-title { font-size: 1.8rem; margin-bottom: 20px; color: #2c3e50; }
        .start-comment { font-size: 1rem; line-height: 1.6; margin-bottom: 30px; text-align: left; background: #f9f9f9; padding: 20px; border-radius: 10px; border: 1px solid #ddd; }
        .primary-btn { padding: 15px 30px; font-size: 1.1rem; background-color: #4CAF50; color: white; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 0 #388E3C; transition: 0.1s; }
        .primary-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #388E3C; }
        .progress { font-size: 0.8rem; color: #999; margin-bottom: 10px; text-align: right; }
        .btn-container { display: flex; justify-content: space-around; margin: 20px 0; }
        .ox-btn { width: 85px; height: 85px; border-radius: 50%; border: none; font-size: 35px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .maru { background-color: #ff4d4d; }
        .batsu { background-color: #3d5afe; }
        .ox-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        #question { font-weight: bold; font-size: 1.1rem; margin-bottom: 20px; min-height: 80px; text-align: left; line-height: 1.6; padding: 0 10px; display: flex; align-items: center; }
        #explanation-container { display: none; background-color: #fff9db; padding: 15px; border-radius: 10px; border-left: 5px solid #fcc419; text-align: left; margin-top: 15px; font-size: 0.95rem; }
        #nextBtn { margin-top: 20px; padding: 15px; background-color: #333; color: white; border: none; border-radius: 30px; display: none; width: 100%; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <!-- 1. スタート画面 -->
        <div id="start-screen">
            <h1 class="start-title">法令一問一答に挑戦！</h1>
            <div class="start-comment">
                法令問題（保安法１５問・液石法１５問）。<br>
                全部で「３０問」。全問正解できるかな？
            </div>
            <button class="primary-btn" onclick="startApp()">一問一答を始める</button>
        </div>

        <!-- 2. クイズ画面 -->
        <div id="quiz-screen" class="hidden">
            <div id="progress-text" class="progress"></div>
            <div id="question"></div>
            
            <div class="btn-container">
                <button id="btn-maru" class="ox-btn maru" onclick="checkAnswer(true)">○</button>
                <button id="btn-batsu" class="ox-btn batsu" onclick="checkAnswer(false)">×</button>
            </div>

            <div id="message" style="font-size:1.6rem; font-weight:bold; margin-bottom:10px;"></div>
            
            <div id="explanation-container">
                <span style="font-weight:bold; color:#e67e22;">【解説】</span><br>
                <div id="explanation-text"></div>
            </div>

            <button id="nextBtn" onclick="nextQuestion()">次の問題へ ➔</button>
        </div>

        <!-- 3. 結果画面 -->
        <div id="result-screen" class="hidden">
            <h2>結果発表</h2>
            <p>あなたの正解数は...</p>
            <div id="final-score" style="font-size:3.5rem; color:#ff4d4d; font-weight:bold; margin: 15px 0;"></div>
            <p id="rank-message" style="font-weight:bold; color:#333; margin-bottom:25px; font-size:1.1rem;"></p>
            <button onclick="location.reload()" class="primary-btn">もう一度挑戦する</button>
        </div>
    </div>

    <script>
        const quizData = [
            { q: "【保安法】高圧ガス保安法は、高圧ガスによる災害を防止して公共の安全を確保する目的のため、民間事業者及び高圧ガス保安協会による高圧ガスの保安に関する自主的な活動を促進することも定めている。", a: true, ex: "（正）高圧法第1条に規定。自主的な活動の促進も目的の一つです。" },
            { q: "【保安法】圧力が0.2メガパスカルとなる場合の温度が35度以下である液化ガスは、高圧ガスではない。", a: false, ex: "（誤）高圧法第2条第3号により、この条件に該当するものは高圧ガスの定義に含まれます。" },
            { q: "【保安法】高圧ガスを充塡した容器の所有者又は占有者は、その容器が危険な状態となったとき、直ちに、所定の災害の発生の防止のための応急の措置を講じなければならない。", a: true, ex: "（正）高圧法第36条第1項に規定されています。" },
            { q: "【保安法】販売業者は、販売所を新たに設けた場合、軽微な変更として、その販売所における高圧ガスの販売の事業開始後遅滞なく、その旨を都道府県知事等に届け出なければならない。", a: false, ex: "（誤）事業開始の20日前までに届け出が必要です。" },
            { q: "【保安法】販売業者は、その所有し、又は占有する容器を盗まれたときは、遅滞なく、その旨を都道府県知事等又は警察官に届け出なければならない。", a: true, ex: "（正）高圧法第63条（事故届）に規定されています。" },
            { q: "【保安法】販売業者は、その所有し、又は占有する第二種貯蔵所に異常があった場合、その貯蔵所に備えた帳簿に所定の事項を記載し、これをその記載の日から2年間保存しなければならない。", a: false, ex: "（誤）異常があった場合の記録は10年間の保存義務があります。" },
            { q: "【保安法】容器に充塡された高圧ガスの輸入をした者は、…検査を受けた旨を都道府県知事等に届け出る必要がなく、かつ、…移動することができる。", a: false, ex: "（誤）輸入した者は都道府県知事への届出が必要です。" },
            { q: "【保安法】販売業者は、高圧ガスの販売の事業を廃止しようとするときは、都道府県知事等の許可を受けなければならない。", a: false, ex: "（誤）廃止したときは、遅滞なく「届け出」ればよく、許可は不要です。" },
            { q: "【保安法】販売業者がその販売所において指定した場所では、何人も火気を取り扱ってはならない。", a: true, ex: "（正）高圧法第37条第1項により、火気の使用が制限されます。" },
            { q: "【保安法】容器に充塡する液化石油ガスの質量は、その容器の内容積に関係なく、最大充塡質量以下のものでなければならない。", a: false, ex: "（誤）質量は内容積Vと定数Cから算出されるため、内容積に関係します。" },
            { q: "【保安法】容器に所定の表示がされているものであることは、高圧ガスを容器に充塡することができる条件の一つである。", a: true, ex: "（正）高圧法第48条第1項第2号に規定されています。" },
            { q: "【保安法】容器を廃棄する者は、その外面に「廃棄容器」と表示すれば、くず化等をする必要はない。", a: false, ex: "（誤）容器として再使用できないよう、くず化処分が必要です。" },
            { q: "【保安法】容器には、「充塡すべき高圧ガスの種類」として、液化石油ガスの名称、略称又は分子式を刻印等することと定められている。", a: true, ex: "（正）容器則第8条第1項第3号に規定されています。" },
            { q: "【保安法】容器に刻印等をすべき事項の一つに、その容器が受けるべき次回の容器再検査の年月がある。", a: false, ex: "（誤）次回の検査年月は刻印事項には含まれていません。" },
            { q: "【保安法】容器の所有者がその容器の外面に表示すべき事項の一つに、液化石油ガスの性質を示す文字「燃」の明示がある。", a: true, ex: "（正）可燃性ガスには「燃」の表示義務があります。" },
            { q: "【液石法】液石法は、災害防止、取引適正化、公共の福祉増進を目的としている。", a: true, ex: "（正）液石法第1条の目的に合致しています。" },
            { q: "【液石法】鉄道車両及び航空機内で調理用にガスを使う者は「一般消費者等」である。", a: false, ex: "（誤）鉄道車両や航空機内は、液石法上の一般消費者等の定義から除外されています。" },
            { q: "【液石法】サービス業で蒸気発生や水温上昇のためにガスを使う者は「一般消費者等」である。", a: true, ex: "（正）施行令第2条第2号に規定されています。" },
            { q: "【液石法】貯蔵能力が3000キログラム以上の供給設備（容器）には、特定供給設備の基準が適用される。", a: true, ex: "（正）3000kg以上の容器供給設備は特定供給設備に該当します。" },
            { q: "【液石法】充てん設備を用いてガスを充てんしようとする者は、経済産業大臣の許可を受けなければならない。", a: false, ex: "（誤）大臣ではなく「都道府県知事」の許可です。" },
            { q: "【液石法】第一種貯蔵所を所有していれば、販売所ごとに自己用貯蔵施設を所有する必要はない。", a: false, ex: "（誤）第一種貯蔵所があれば、別途3㎡以上の施設は不要となります。" },
            { q: "【液石法】保安業務を行おうとする者は、販売事業の登録を受けた者でなければ認定を受けることができない。", a: false, ex: "（誤）販売事業者でなくても保安機関としての認定は受けられます。" },
            { q: "【液石法】委託契約書に記載すべき事項に、「結果を販売事業者に連絡する方法」がある。", a: true, ex: "（正）規則第28条に規定された必須記載事項です。" },
            { q: "【液石法】保安業務の一つに、災害防止に関し必要な事項を周知させる業務がある。", a: true, ex: "（正）「周知」は重要な保安業務の一つです。" },
            { q: "【液石法】業務主任者の要件は、二種販売免状を有し、6か月以上の実務経験があることである。", a: true, ex: "（正）液石法第19条および規則に規定されています。" },
            { q: "【液石法】業務主任者の代理者を選任することは、業務主任者の職務である。", a: false, ex: "（誤）代理者の選任は「販売事業者」の義務です。" },
            { q: "【液石法】業務主任者の代理者の選任は、消費者数に関係なく販売所ごとに1人以上必要である。", a: true, ex: "（正）販売所ごとに最低1人は必要です。" },
            { q: "【液石法】販売契約締結時の交付書面には「保安機関の名称、住所及び連絡方法」を記載する。", a: true, ex: "（正）液石法第14条の規定による必須記載事項です。" },
            { q: "【液石法】販売所の帳簿には「貯蔵施設又は特定供給設備に異常があった場合」を記載する。", a: true, ex: "（正）異常時の記録は帳簿への記載義務があります。" },
            { q: "【液石法】消費設備の調査ができるのは、二種販売免状または設備士免状の保持者に限られる。", a: false, ex: "（誤）製造保安責任者免状など、他の資格者も調査可能です。" }
        ];

        let currentIdx = 0;
        let score = 0;

        // ★追加：配列をランダムに並び替える関数
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startApp() {
            // ★スタート時に問題をシャッフルする
            shuffleArray(quizData);
            
            currentIdx = 0;
            score = 0;
            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("quiz-screen").classList.remove("hidden");
            document.getElementById("result-screen").classList.add("hidden"); // 再挑戦時用
            showQuestion();
        }

        function showQuestion() {
            const data = quizData[currentIdx];
            document.getElementById("progress-text").innerText = `第 ${currentIdx + 1} 問 / 全 ${quizData.length} 問`;
            document.getElementById("question").innerText = data.q;
            document.getElementById("message").innerText = "";
            document.getElementById("explanation-container").style.display = "none";
            document.getElementById("nextBtn").style.display = "none";
            document.getElementById("btn-maru").disabled = false;
            document.getElementById("btn-batsu").disabled = false;
        }

        function checkAnswer(userChoice) {
            const data = quizData[currentIdx];
            const message = document.getElementById("message");
            
            if (userChoice === data.a) {
                message.innerText = "⭕ 正解！";
                message.style.color = "#ff4d4d";
                score++;
            } else {
                message.innerText = "❌ 不正解...";
                message.style.color = "#3d5afe";
            }

            document.getElementById("explanation-text").innerText = data.ex;
            document.getElementById("explanation-container").style.display = "block";
            document.getElementById("btn-maru").disabled = true;
            document.getElementById("btn-batsu").disabled = true;
            document.getElementById("nextBtn").style.display = "block";
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");
            document.getElementById("final-score").innerText = `${score} / ${quizData.length}`;
            document.getElementById("rank-message").innerText = getRankMessage();
        }

        function getRankMessage() {
            const rate = score / quizData.length;
            if (rate === 1) return "完璧！免許皆伝です！";
            if (rate >= 0.8) return "素晴らしい！合格圏内です。";
            if (rate >= 0.6) return "あと一歩！繰り返し解きましょう。";
            return "まずは基礎から復習しましょう！";
        }
    </script>
</body>
</html>
