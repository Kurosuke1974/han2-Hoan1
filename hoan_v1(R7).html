    <script>
        (function() {
            // ★アイコンの色を変えたい場合は、ここにあるカラーコードを変更してください！
            const bgColor = '#1a365d';   // アイコンの背景色（現在は落ち着いたダークブルー）
            const textColor1 = 'white';   // 1行目「販二」の文字色（現在は白）
            const textColor2 = '#ff9f43'; // 2行目「保１」の文字色（現在はオレンジ）

            // キャンバスを使って180x180のPNG画像をその場で生成
            const canvas = document.createElement('canvas');
            canvas.width = 180;
            canvas.height = 180;
            const ctx = canvas.getContext('2d');

            // 背景（角丸四角形）を描画
            ctx.fillStyle = bgColor;
            const r = 40; // 角丸の半径
            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(180 - r, 0);
            ctx.arcTo(180, 0, 180, r, r);
            ctx.lineTo(180, 180 - r);
            ctx.arcTo(180, 180, 180 - r, 180, r);
            ctx.lineTo(r, 180);
            ctx.arcTo(0, 180, 0, 180 - r, r);
            ctx.lineTo(0, r);
            ctx.arcTo(0, 0, r, 0, r);
            ctx.closePath();
            ctx.fill();

            // 文字の共通設定
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 44px sans-serif';

            // 1行目「販二」を描画
            ctx.fillStyle = textColor1;
            ctx.fillText('販二', 90, 55);

            // 2行目「保１」を描画
            ctx.fillStyle = textColor2;
            ctx.fillText('保１', 90, 120);

            // 生成したPNG画像をアイコンとしてリンクタグに設定
            const iconUrl = canvas.toDataURL('image/png');
            
            const appleLink = document.createElement('link');
            appleLink.rel = 'apple-touch-icon';
            appleLink.href = iconUrl;
            document.head.appendChild(appleLink);

            const faviconLink = document.createElement('link');
            faviconLink.rel = 'icon';
            faviconLink.type = 'image/png';
            faviconLink.href = iconUrl;
            document.head.appendChild(faviconLink);
        })();
    </script>

    <script>

            { q: "【単位】熱力学温度 288Kは、セルシウス温度ではおよそ15℃である。", a: true, ex: "（正）熱力学温度(K) = セルシウス温度(°C) + 273.15 なので、288K - 273 = 15℃です。" },
            { q: "【単位】ゲージ圧力は、大気圧に絶対圧力を加えたものである。", a: false, ex: "（誤）絶対圧力 = ゲージ圧力 + 大気圧 です。記述は逆になっています。" },
            { q: "【単位】LPガス1kg当たりの発熱量を50MJとすると、LPガスの消費量1kg/hはおよそ14kWと計算される。", a: true, ex: "（正）1kg/hの消費量はおよそ14kWに相当します。" },

            { q: "【特性】標準状態におけるブタンの空気に対する比重（ガスの比重）は、およそ2である。", a: true, ex: "（正）ブタンの分子量は58、空気の平均分子量は29。比重は 58 ÷ 29 = 2.0 です。" },
            { q: "【特性】標準大気圧（0.1013MPa）下において、プロパンの沸点は、ブタンの沸点よりも低い。", a: true, ex: "（正）プロパンの沸点は -42.1℃、ブタンは -0.5℃であり、プロパンの方が低いです。" },

            { q: "【検査機器】電気式（ダイヤフラム式）自記圧力計の電池交換は、周囲のガス漏れの有無に関係なく行うことができる。", a: false, ex: "（誤）電池交換は、ガス漏れのおそれのない安全な場所で行う必要があります。" },

            // 問11〜13（燃焼特性）
            { q: "【燃焼】ブンゼン燃焼において生じるフラッシュバックは、炎がバーナの口から浮き上がって、ある間隔を隔てて空間で燃焼する現象である。", a: false, ex: "（誤）記述は「リフティング」の説明です。フラッシュバック（逆火）は火がバーナの中に入る現象です。" },
            { q: "【燃焼】炎が低温の固体などに触れてその温度が下がることによって不完全燃焼が生じることがある。", a: true, ex: "（正）炎が冷やされると不完全燃焼を起こし、一酸化炭素を発生しやすくなります。" },
            { q: "【燃焼】ブンゼン燃焼では、一次空気を必要としない。", a: false, ex: "（誤）ブンゼン燃焼は、あらかじめ混合する「一次空気」と、周囲から取り込む「二次空気」の両方を使います。" },
            { q: "【燃焼】イエローチップは、一次空気が不足したときに起こる。", a: true, ex: "（正）一次空気が不足すると、炎の先端が赤黄色になるイエローチップが発生します。" },

            // 問14（燃焼器安全装置）
            { q: "【燃焼器】圧力スイッチ式の空だき防止装置（深だき防止）は、浴槽に十分な水位がない場合、装置内部のダイヤフラムが動いて接点が開き、ガス通路が閉じることで空だきを防止する。", a: true, ex: "（正）水位（圧力）を検知して空だきを防ぐ仕組みです。" },
            { q: "【燃焼器】調理油過熱防止装置は、調理油が自然発火する温度に達する前に自動的にガスを遮断し、火災の発生を防止する機能を有する。", a: true, ex: "（正）調理油が自然発火する前（約250℃）にガスを止めます。" },
            { q: "【燃焼器】フレームロッド式の立ち消え安全装置は、炎の導電性と整流性を利用して炎の検知を行う。", a: true, ex: "（正）フレームロッドは炎の導電性を利用して炎を検知します。" },
            { q: "【燃焼器】過熱防止装置には、バイメタルまたは温度ヒューズが用いられているものがあるが、いずれの素子も作動した後に温度が下がれば復元する。", a: false, ex: "（誤）バイメタルは復元しますが、温度ヒューズは一度溶断すると復元しません（交換が必要）。" },

            // 問15（燃焼器・施設）
            { q: "【燃焼器】CF式燃焼器（半密閉式自然排気型）の設置工事に際し、排気筒の曲がりを4か所とした。", a: true, ex: "（正）CF式の排気筒の曲がりは4か所までとされています。" },
            { q: "【燃焼器】屋外で使用するRF式燃焼器であっても、排ガスが機器の給気に取り入れられ再循環すると不完全燃焼の原因となることがある。", a: true, ex: "（正）屋外式(RF)でも、排ガスを吸い込むと不完全燃焼の原因になります。" },
            { q: "【燃焼器】排気筒の材料として、ステンレス鋼板SUS304以外のものは使用できない。", a: false, ex: "（誤）SUS304「またはこれと同等以上の耐食性をもつもの」が使用可能です。" },
            { q: "【燃焼器】FF式燃焼器（密閉式強制排気型）は、燃焼用空気を屋内から取り入れ、燃焼ガスを排気用送風機で強制的に屋外に排出する方式である。", a: false, ex: "（誤）FF式は、燃焼用空気を「屋外（外）」から取り入れます。" },

            // 問16（施設）
            { q: "【施設】貯蔵施設の明り採りのために屋根材に硬質塩化ビニル板を使用する場合、窓の面積を全体の1/4以下にしなければならない。", a: true, ex: "（正）明り採り窓の面積制限に関する一般的な基準です。" },
            { q: "【施設】可燃性ガスの貯蔵施設に設置する照明設備を、発火源とならないよう耐圧防爆構造のものとした。", a: true, ex: "（正）可燃性ガスの貯蔵所では、照明は耐圧防爆構造とします。" },
            { q: "【施設】床面積5m²の貯蔵施設における消火設備として、能力単位A4およびB10である粉末消火器を1個設置した。", a: false, ex: "（誤）消火器は能力単位に関わらず、最低でも「2本以上」設置が必要です。" },
            { q: "【施設】四方を障壁で囲まれた床面積10m²の貯蔵施設に、床面に接し、かつ外気に面した面積が2500cm²の換気口を2方向にそれぞれ1か所ずつ設けた。", a: false, ex: "（誤）床面積10m²の場合、必要な換気面積は計3000cm²（300cm²/m²）以上必要です。" },

            // 問17（供給）
            { q: "【供給】連結用高圧ホースを用いて容器2本と調整器を接続する設備では、容器交換時に消費を中断することなく容器交換を行うことができる。", a: true, ex: "（正）連結用高圧ホースの逆止弁等により、ガスを止めずに容器交換が可能です。" },
            { q: "【供給】大気中の湿度が高いと、容器の外面に結露もしくは着霜しにくくなり、容器への熱の供給が促進される。", a: false, ex: "（誤）湿度が高いと結露・着霜しやすくなります。記述は逆です。" },
            { q: "【供給】LPガス設備の配管等の圧力損失は、その中を流れるLPガスの比重が同じであれば流量が多くなるほど大きくなる。", a: true, ex: "（正）流量の増加に伴い、配管抵抗による圧力損失は大きくなります。" },
            { q: "【供給】気密試験を行う部分の配管用フレキ管が呼び径15A・長さ50mであったので、電気式ダイヤフラム式自記圧力計を使用して保持時間を2分とした。※1m当たりの容積0.22L", a: false, ex: "（誤）容積は 0.22L × 50m = 11L となり、10Lを超えるため保持時間は5分以上必要です。" },

            // 問18（防食・供給）
            { q: "【防食】土壌中に設置したマグネシウム陽極と鋼管を電線で接続し、その電位差により生じた防食電流により防食する電気防食法を外部電源法という。", a: false, ex: "（誤）マグネシウム等を使う方法は「流電陽極法」です。外部電源法とは別です。" },
            { q: "【供給】最大ガス消費量を求める際に用いられる設備全体の最大ガス消費率、消費者戸数に応じて変化する。", a: true, ex: "（正）戸数が多いほど、全世帯が同時に最大火力を使う確率は下がるため、消費率は変化（低下）します。" },
            { q: "【供給】自動切替式調整器と50kg型容器を用いた自然気化方式の供給設備において、予備側に設置する容器の本数を使用側の設置本数と同数とした。", a: true, ex: "（正）自然気化方式では、通常、使用側と予備側を同数設置します。" },
            { q: "【供給】ガス用ポリエチレン管を埋設して使用する場合は、車両荷重などがかかる場所であっても埋設深度を考慮しなくてよい。", a: false, ex: "（誤）車両荷重がかかる場所など、埋設深度の基準を厳格に守る必要があります。" },

            // 問19（バルク）
            { q: "【バルク】2基のバルク貯槽を相互に接続して設置した際に、バルク貯槽間において液移動が発生しないように対策を施した。", a: true, ex: "（正）均圧管の波動等による液移動（過充填など）を防ぐ対策が必要です。" },
            { q: "【バルク】バルク貯槽の安全弁の元弁には、インターロック方式（3方弁方式）や手動弁方式がある。", a: true, ex: "（正）安全弁の整備・点検のために元弁（3方弁等）が設けられています。" },
            { q: "【バルク】新型バルクローリ充てん設備のポンプまたは圧縮機は、軸シール部のない構造のもの以外は使用できない。", a: false, ex: "（誤）軸シール部がある構造でも、ガス漏れ検知装置等の基準を満たせば使用可能です。" },
            { q: "【バルク】新型バルクローリ充てん設備には、本体に固定された緊急停止スイッチと、離れても操作ができる携帯式の緊急停止スイッチの両方を設けなければならない。", a: true, ex: "（正）新型バルクローリには、本体固定と携帯式の両方の緊急停止スイッチが必要です。" },

            // 問20（販売・移動）
            { q: "【販売】貯蔵施設内において、20kg型ガス容器を2段積みにして保管した。", a: false, ex: "（誤）容器は原則として「立てて（1段で）」保管します。2段に積み重ねるのは危険です。" },
            { q: "【販売】LPガスを体積販売する際に、充てん容器をLPガス販売事業者が供給設備に接続した。", a: true, ex: "（正）販売事業者が設備に接続し管理を行うのが体積販売の基本です。" },
            { q: "【販売】マイコンメーターSを設置した設備の点検において、6か月に1回メーターの警告表示を確認することで、配管の漏えい試験を完全に代替することができる。", a: false, ex: "（誤）マイコンメーターで代替できるのはメーター下流側の漏えい試験等であり、すべての点検を代替できるわけではありません。" },
            { q: "【販売】不在消費者宅の容器交換において、交換後に容器バルブを閉止しておき、「消費者がガス栓の閉止を確認した上でなければバルブを開けてはならない」旨を記載した文書をバルブに取り付けた。", a: true, ex: "（正）不在時の容器交換における、安全確保のための適切な処置です。" },
            { q: "【移動】50kg型充てん容器10本をトラックで移動する際、車両に備え付けの赤色合図灯を携行したので、赤旗は携行しなかった。", a: false, ex: "（誤）赤色合図灯（警戒灯）があっても、基準で定められた赤旗を省略することはできません。" },
            { q: "【移動】50kg型充てん容器10本（質量計約1,000kg）をトラックで移動する際、能力単位B10の粉末消火器2個を携行した。", a: true, ex: "（正）積載量に応じた消火器（この本数ならB10以上が2個等）が必要です。記述の条件なら問題ありません。" },
            { q: "【移動】50kg型充てん容器1本をトラックで移動するため、その容器を横積みとした。", a: false, ex: "（誤）容器の移動は「立て積み」または「斜め積み」が原則であり、横積みは禁止されています。" },
            { q: "【移動】車両の車輪止めを確実に行ってから、充てん容器の積みおろしを行った。", a: true, ex: "（正）積みおろし作業時の車両の不意な動きを防ぐため、車輪止めは必須です。" }
        ];

        let quizData = []; // 今回出題する20問を格納する配列
        let currentIdx = 0;
        let score = 0;

        // 配列をシャッフルする関数
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // アプリをスタートする関数
        function startApp() {
            shuffleArray(allQuizData);
            quizData = allQuizData.slice(0, 20);
            currentIdx = 0;
            score = 0;
            
            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("quiz-screen").classList.remove("hidden");
            document.getElementById("result-screen").classList.add("hidden");
            
            showQuestion();
        }

        // 問題を表示する関数
        function showQuestion() {
            const data = quizData[currentIdx];
            document.getElementById("progress-text").innerText = `第 ${currentIdx + 1} 問 / 全 ${quizData.length} 問`;
            document.getElementById("question").innerText = data.q;
            document.getElementById("message").innerText = "";
            document.getElementById("explanation-container").style.display = "none";
            document.getElementById("nextBtn").style.display = "none";
            document.getElementById("btn-maru").disabled = false;
            document.getElementById("btn-batsu").disabled = false;
        }

        // 回答をチェックする関数
        function checkAnswer(userChoice) {
            const data = quizData[currentIdx];
            const message = document.getElementById("message");
            
            if (userChoice === data.a) {
                message.innerText = "⭕ 正解！";
                message.style.color = "#ff4d4d";
                score++;
            } else {
                message.innerText = "❌ 不正解...";
                message.style.color = "#3d5afe";
            }

            document.getElementById("explanation-text").innerText = data.ex;
            document.getElementById("explanation-container").style.display = "block";
            document.getElementById("btn-maru").disabled = true;
            document.getElementById("btn-batsu").disabled = true;
            document.getElementById("nextBtn").style.display = "block";
        }

        // 次の問題に進む関数
        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        // 結果画面を表示する関数
        function showResult() {
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");
            document.getElementById("final-score").innerText = score + " / " + quizData.length;
            document.getElementById("rank-message").innerText = getRankMessage();
        }

        // スコアに応じたメッセージを返す関数
        function getRankMessage() {
            const rate = score / quizData.length;
            if (rate === 1) return "完璧！保安管理マスターです！";
            if (rate >= 0.8) return "素晴らしい！本試験でも確実に合格圏内です。";
            if (rate >= 0.6) return "あと一歩！間違えた問題を復習しましょう。";
            return "基礎的な数値やひっかけパターンをもう一度確認してみましょう！";
        }
    </script>
